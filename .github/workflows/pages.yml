name: Publicar sitio

on:
  push:
    branches: [dev]
    paths:
      - "site/**"
      - "src/**"
      - "CMakeLists.txt"
      - "resources/**"
      - "assets/icons/**"
      - "tests/**"
      - "assets/images/**"
      - "assets/logos/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - name: Instalar dependencias del entorno Debian estable
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake qt6-base-dev \
            libqt6sql6-sqlite qtkeychain-qt6-dev unzip file
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Compilar paquete .deb de desarrollo
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCUB3_PACKAGE_REVISION="${GITHUB_RUN_NUMBER}"
          cmake --build build --parallel 2
          cpack --config build/CPackConfig.cmake -B build/packages
          package=$(find build/packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$package"
          depends=$(dpkg-deb -f "$package" Depends)
          version=$(dpkg-deb -f "$package" Version)
          echo "Package version: $version"
          echo "Package dependencies: $depends"
          if printf '%s' "$depends" | grep -q 't64'; then
            echo "Unexpected t64 dependency in Debian 12 build" >&2
            exit 1
          fi
          case "$version" in
            *+dev.*) ;;
            *) echo "Development package version is not upgradeable: $version" >&2; exit 1 ;;
          esac
          printf '%s' "$depends" | grep -q 'qt6-qpa-plugins' || {
            echo "Qt platform plugins are missing from the package dependencies" >&2
            exit 1
          }
          apt-get install -y "$package"
          set +e
          QT_QPA_PLATFORM=offscreen timeout --kill-after=2s 8s cub3 > build/package-smoke.log 2>&1
          smoke_status=$?
          set -e
          cat build/package-smoke.log
          if [ "$smoke_status" -ne 124 ]; then
            echo "The installed Debian package did not stay running in the offscreen startup test (exit $smoke_status)" >&2
            exit 1
          fi
          if grep -q 'Could not load the Qt platform plugin' build/package-smoke.log; then
            echo "Qt platform plugin failed to load" >&2
            exit 1
          fi
          mkdir -p site/downloads
          cp "$package" site/downloads/cub3-launcher-dev-amd64.deb
      - name: Preparar sitio estático
        run: |
          mkdir -p _site/assets/logos _site/assets/platforms _site/downloads
          cp site/index.html site/politica.html site/styles.css _site/
          cp site/assets/*.png site/assets/*.svg _site/assets/
          cp site/assets/logos/*.svg _site/assets/logos/
          cp site/assets/platforms/*.png _site/assets/platforms/
          cp site/downloads/cub3-launcher-dev-amd64.deb _site/downloads/
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
