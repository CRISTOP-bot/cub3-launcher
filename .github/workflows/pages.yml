name: Publicar sitio

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "assets/images/**"
      - "assets/logos/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Descargar código
        uses: actions/checkout@v4
      - name: Preparar sitio estático
        run: |
          mkdir -p _site/assets/logos
          cp site/index.html site/styles.css _site/
          cp site/assets/*.png site/assets/*.svg _site/assets/
          cp site/assets/logos/*.svg _site/assets/logos/
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
