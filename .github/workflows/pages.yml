name: Publicar sitio

on:
  workflow_run:
    workflows: ["Build and test"]
    types: [completed]
    branches: [dev]

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event.workflow_run.event == 'push' && github.event.workflow_run.conclusion == 'success'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    container:
      image: debian:bookworm
    steps:
      - name: Instalar dependencias del entorno Debian estable
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git build-essential cmake python3 qt6-base-dev \
            libqt6sql6-sqlite qtkeychain-qt6-dev unzip file
      - name: Descargar código del commit validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - name: Descargar ZIP de Windows del mismo CI exitoso
        uses: actions/download-artifact@v4
        with:
          name: cub3-launcher-windows-x64
          path: windows-artifact
          github-token: ${{ secrets.GITHUB_TOKEN }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}
      - name: Verificar y preparar ZIP de Windows y su checksum
        run: python3 scripts/stage_windows_bundle.py windows-artifact site/downloads
      - name: Validar sitio y referencias locales
        run: |
          python3 tests/SiteTests.py
          python3 tests/WindowsBundleTests.py
      - name: Compilar paquete .deb de desarrollo
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=OFF \
            -DCUB3_PACKAGE_REVISION="${GITHUB_RUN_NUMBER}"
          cmake --build build --parallel 2
          cpack --config build/CPackConfig.cmake -B build/packages
          package=$(find build/packages -maxdepth 1 -type f -name '*.deb' -print -quit)
          test -n "$package"
          depends=$(dpkg-deb -f "$package" Depends)
          version=$(dpkg-deb -f "$package" Version)
          echo "Package version: $version"
          echo "Package dependencies: $depends"
          if printf '%s' "$depends" | grep -q 't64'; then
            echo "Unexpected t64 dependency in Debian 12 build" >&2
            exit 1
          fi
          case "$version" in
            *+dev.*) ;;
            *) echo "Development package version is not upgradeable: $version" >&2; exit 1 ;;
          esac
          printf '%s' "$depends" | grep -q 'qt6-qpa-plugins' || {
            echo "Qt platform plugins are missing from the package dependencies" >&2
            exit 1
          }
          apt-get install -y "./$package"
          set +e
          QT_QPA_PLATFORM=offscreen timeout --kill-after=2s 8s cub3 > build/package-smoke.log 2>&1
          smoke_status=$?
          set -e
          cat build/package-smoke.log
          if [ "$smoke_status" -ne 124 ]; then
            echo "The installed Debian package did not stay running in the offscreen startup test (exit $smoke_status)" >&2
            exit 1
          fi
          if grep -q 'Could not load the Qt platform plugin' build/package-smoke.log; then
            echo "Qt platform plugin failed to load" >&2
            exit 1
          fi
          mkdir -p site/downloads
          cp "$package" site/downloads/cub3-launcher-dev-amd64.deb
      - name: Preparar sitio estático
        run: |
          mkdir -p _site/assets/logos _site/assets/platforms _site/downloads
          cp site/index.html site/politica.html site/styles.css _site/
          cp site/assets/*.png site/assets/*.svg _site/assets/
          cp site/assets/logos/*.svg _site/assets/logos/
          cp site/assets/platforms/*.png _site/assets/platforms/
          cp site/downloads/cub3-launcher-dev-amd64.deb _site/downloads/
          cp site/downloads/cub3-launcher-windows-x64.zip site/downloads/cub3-launcher-windows-x64.zip.sha256 _site/downloads/
      - name: Comprobar paquete, contenido y recursos publicados
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          checked_out_sha=$(git -c safe.directory="$GITHUB_WORKSPACE" -C "$GITHUB_WORKSPACE" rev-parse HEAD)
          echo "Expected source commit: $EXPECTED_SOURCE_SHA"
          echo "Checked-out source commit: $checked_out_sha"
          test "$checked_out_sha" = "$EXPECTED_SOURCE_SHA"
          grep -Fq 'id="cpp-edition"' _site/index.html
          grep -Fq 'Aún no existe un juego C++ jugable ni una descarga.' _site/index.html
          sha256sum _site/index.html
          test -s _site/downloads/cub3-launcher-dev-amd64.deb
          test -s _site/downloads/cub3-launcher-windows-x64.zip
          test -s _site/downloads/cub3-launcher-windows-x64.zip.sha256
          file _site/downloads/cub3-launcher-dev-amd64.deb | grep -q 'Debian binary package'
          verification_dir=$(mktemp -d)
          trap 'rm -rf "$verification_dir"' EXIT
          python3 scripts/stage_windows_bundle.py _site/downloads "$verification_dir"
          cmp _site/downloads/cub3-launcher-windows-x64.zip "$verification_dir/cub3-launcher-windows-x64.zip"
          cmp _site/downloads/cub3-launcher-windows-x64.zip.sha256 "$verification_dir/cub3-launcher-windows-x64.zip.sha256"
          for asset in cherry-grove.png launcher-preview.png; do test -s "_site/assets/$asset"; done
          for logo in linux.png windows.png macos.png; do test -s "_site/assets/platforms/$logo"; done
          test -s _site/assets/logos/cub3-logo-01-island.svg
      - name: Preparar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir sitio
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
